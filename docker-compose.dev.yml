name: ehd2

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ehd}
      POSTGRES_USER: ${POSTGRES_USER:-ehd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehd_local}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # начиная с postgres:18 официальный образ объявляет VOLUME /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-ch_admin_local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CH_HTTP_HOST_PORT:-8123}:8123"
      - "${CH_NATIVE_HOST_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  ehd-api:
    build:
      context: ./back
      target: dev
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      APP_ENV: local
      HTTP_PORT: "8080"
      LOG_LEVEL: debug
      PG_DSN: postgres://${POSTGRES_USER:-ehd}:${POSTGRES_PASSWORD:-ehd_local}@postgres:5432/${POSTGRES_DB:-ehd}?sslmode=disable
      CH_ADDR: clickhouse:9000
      CH_DB: ${CLICKHOUSE_SRC_DB:-ehd_src}
      CH_USER: ${CLICKHOUSE_RO_USER:-reporter_ro}
      CH_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-reporter_ro_local}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.kz}
      # Auth Module: ключи PII/HMAC (local dev-значения; в non-local обязательны и вне репозитория)
      AUTH_ENC_KEY: ${AUTH_ENC_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      AUTH_HMAC_KEY: ${AUTH_HMAC_KEY:-ehd-local-hmac-key}
      SESSION_TTL: ${SESSION_TTL:-3h}
      TEMP_PASSWORD_TTL: ${TEMP_PASSWORD_TTL:-72h}
      MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS:-3}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./back:/app
      - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  ehd-web:
    build:
      context: ./front
      target: dev
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      NUXT_API_BASE: http://ehd-api:8080
    volumes:
      - ./front:/app
      - webmodules:/app/node_modules
    depends_on:
      - ehd-api

volumes:
  pgdata:
  chdata:
  gomod:
  webmodules:
