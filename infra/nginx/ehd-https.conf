# Полный конфиг nginx с TLS. bootstrap.sh копирует его в conf.d/ (заменяя bootstrap.conf)
# ПОСЛЕ успешного выпуска сертификата Let's Encrypt для ehd.makeit.kz + apiehd.makeit.kz.
# Один сертификат покрывает оба домена (apiehd — как SAN), поэтому live-каталог общий.

# --- HTTP: ACME-челлендж + редирект на HTTPS ---
server {
    listen 80;
    server_name ehd.makeit.kz apiehd.makeit.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: фронтенд (Nuxt SSR) + проксирование /api на бэкенд ---
server {
    listen 443 ssl;
    http2 on;
    server_name ehd.makeit.kz;

    ssl_certificate     /etc/letsencrypt/live/ehd.makeit.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehd.makeit.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://ehd-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ehd-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS: прямой доступ к API (apiehd.makeit.kz) ---
server {
    listen 443 ssl;
    http2 on;
    server_name apiehd.makeit.kz;

    ssl_certificate     /etc/letsencrypt/live/ehd.makeit.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehd.makeit.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location / {
        proxy_pass http://ehd-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
